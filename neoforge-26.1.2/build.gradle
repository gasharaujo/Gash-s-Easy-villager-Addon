plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-neoforge-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
neoForge {
    version = loader_version
    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file(project.hasProperty('verification') ? 'build/verification-run' : 'run/server')
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation "maven.modrinth:easy-villagers:${easy_villagers_version}"
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('processResources').configure {
    def properties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
        minecraft_version: minecraft_version, loader_version: loader_version,
        easy_villagers_min_version: easy_villagers_min_version
    ]
    inputs.properties properties
    filesMatching('META-INF/*.toml') { expand properties }
}

tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDir('../common/src/main/resources')

// Opt-in integration harness, excluded from distributable builds.
if (project.hasProperty('verification')) {
    sourceSets.main.java.srcDir('src/verification/java')
    sourceSets.main.java.srcDir('../verification/src/main/java')
    tasks.named('processResources').configure {
        doLast {
            file("${destinationDir}/META-INF/neoforge.mods.toml").append('''

[[mods]]
modId = "gashs_easy_villager_addon_verification"
version = "1.0.0"
displayName = "Addon isolated integration checks"
''')
        }
    }
}
tasks.named('processResources').configure { inputs.property('verification', project.hasProperty('verification')) }
tasks.named('jar').configure { exclude('**/Verification*.class') }

if (project.hasProperty('uiVerification')) {
    neoForge.runs.server.systemProperty 'addon.uiVerification', 'true'
    neoForge.runs.client.systemProperty 'addon.uiVerification', 'true'
    neoForge.runs.client.gameDirectory = project.file('build/ui-client')
    neoForge.runs.client.programArguments.addAll('--quickPlaySingleplayer', 'GashUiTest', '--username', 'GashUiTest', '--width', '1280', '--height', '720')
}
